<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MessMate — Simple Food & Mess Management</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12'
            }
          }
        }
      }
    }
  </script>

  <!-- Custom App Styles -->
  <link rel="stylesheet" href="/css/app.css">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
</head>
<body class="bg-[#fbfbf9] text-stone-900 min-h-screen antialiased selection:bg-orange-500 selection:text-white">

  <!-- Root Application Container -->
  <div id="app-root" class="min-h-screen flex flex-col">
    <div class="p-12 text-center text-stone-400 font-semibold animate-pulse">
      Loading MessMate...
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modal-container" class="hidden"></div>

  <!-- Toast Notification Stack -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 max-w-sm pointer-events-none"></div>

  <!-- Component Scripts -->
  <script src="/js/seed_avatars.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/dashboard.js"></script>
  <script src="/js/components/attendance.js"></script>
  <script src="/js/components/students.js"></script>
  <script src="/js/components/profile.js"></script>
  <script src="/js/components/billing.js"></script>
  <script src="/js/components/payments.js"></script>
  <script src="/js/components/menu.js"></script>
  <script src="/js/components/ai_demand.js"></script>
  <script src="/js/components/reports.js"></script>
  <script src="/js/components/settings.js"></script>
  <script src="/js/components/student_view.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
